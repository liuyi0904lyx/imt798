import requests
import xml.etree.ElementTree as ET
from xml.dom import minidom
from datetime import datetime, timedelta
import time
import random
import argparse
import re

class HunanTelecomEPG:
    def __init__(self):
        # 接口配置（与原PHP版本完全一致）
        self.base_url = "http://10.255.0.110/mgtv_hndx"
        self.channel_list_url = f"{self.base_url}/EPGV2/GetChannelList"
        self.playbill_url = f"{self.base_url}/BasicIndex/GetPlaybill"
        
        # 请求参数
        self.common_params = {
            "OutputType": "json",
            "Version": "YYS.4.5.19.266.2.HNDX.0.0_Release_HW_4K"
        }
        
        # 初始化XML根节点
        self.xml_root = ET.Element("tv")
        self.xml_root.set("generator-info-name", "湖南电信IPTV-EPG")
        
        # 随机延迟配置
        self.min_delay = 0.1  # 最小延迟时间（秒）
        self.max_delay = 5.0  # 最大延迟时间（秒）

    def _send_request(self, url, params=None):
        """发送HTTP请求并返回JSON数据"""
        try:
            if params is None:
                params = {}
            
            # 合并公共参数和请求参数
            request_params = {**self.common_params, **params}
            
            response = requests.get(
                url,
                params=request_params,
                timeout=10,
                headers={
                    "User-Agent": "Dalvik/2.1.0 (Linux; U; Android 9; HG680-KD Build/PPR1.180610.011)"
                }
            )
            
            response.raise_for_status()
            return response.json()
        
        except requests.exceptions.RequestException as e:
            print(f"请求失败: {str(e)}")
            return None
        except ValueError as e:
            print(f"JSON解析错误: {str(e)}")
            return None

    def _clean_channel_name(self, name):
        """
        清理频道名称，去除"高清"字样
        :param name: 原始频道名称
        :return: 处理后的频道名称
        """
        if not name:
            return ""
            
        # 使用正则表达式去除"高清"字样，支持各种位置和格式
        cleaned_name = re.sub(r"[(\s]*高清[)\s]*", "", name, flags=re.IGNORECASE)
        
        # 去除可能产生的多余空格
        cleaned_name = re.sub(r"\s+", " ", cleaned_name).strip()
        
        # 如果处理后为空字符串，保留原始名称
        if not cleaned_name:
            return name
            
        return cleaned_name

    def _process_channels(self, channels):
        """
        频道列表预处理：先清理名称，再去重
        :param channels: 原始频道列表
        :return: 处理后的频道列表（包含原始名称和清理后的名称）
        """
        # 第一步：为每个频道添加清理后的名称
        processed_channels = []
        for channel in channels:
            original_name = channel.get('name', '')
            cleaned_name = self._clean_channel_name(original_name)
            
            processed_channel = channel.copy()
            processed_channel['original_name'] = original_name
            processed_channel['cleaned_name'] = cleaned_name
            processed_channels.append(processed_channel)
            
            if original_name != cleaned_name:
                print(f"频道名称处理: {original_name} -> {cleaned_name}")
        
        # 第二步：基于清理后的名称去重
        seen = set()
        unique_channels = []
        
        for channel in processed_channels:
            cleaned_name = channel.get('cleaned_name', '')
            
            # 处理空名称的情况
            if not cleaned_name:
                unique_channels.append(channel)
                continue
                
            # 去重逻辑：基于清理后的名称
            if cleaned_name not in seen:
                seen.add(cleaned_name)
                unique_channels.append(channel)
            else:
                print(f"发现重复频道，已跳过: {channel.get('original_name', '未知频道')} (清理后: {cleaned_name})")
        
        print(f"频道处理完成: 原始 {len(channels)} 个，处理后 {len(unique_channels)} 个")
        return unique_channels

    def _format_time(self, date_str, time_str, duration_minutes):
        """
        转换时间格式为XMLTV标准格式
        :param date_str: 日期字符串(YYYYMMDD)
        :param time_str: 时间字符串(HHMMSS或HHMM)
        :param duration_minutes: 节目时长(分钟)
        :return: (开始时间, 结束时间)
        """
        # 处理时间格式，补全为6位
        time_str = time_str.ljust(6, '0')
        time_str = time_str[:2] + ":" + time_str[2:4] + ":" + time_str[4:6]
        
        # 解析开始时间
        start_time = datetime.strptime(f"{date_str} {time_str}", "%Y%m%d %H:%M:%S")
        
        # 计算结束时间
        end_time = start_time + timedelta(minutes=duration_minutes)
        
        # 转换为XMLTV格式
        return (
            start_time.strftime("%Y%m%d%H%M%S +0800"),
            end_time.strftime("%Y%m%d%H%M%S +0800")
        )

    def _prettify_xml(self):
        """美化XML输出格式"""
        rough_string = ET.tostring(self.xml_root, 'utf-8')
        reparsed = minidom.parseString(rough_string)
        return reparsed.toprettyxml(indent="  ", encoding="UTF-8").decode("utf-8")
        
    def _random_sleep(self):
        """
        随机延迟一段时间，范围在self.min_delay到self.max_delay之间
        """
        delay = random.uniform(self.min_delay, self.max_delay)
        print(f"随机延迟 {delay:.2f} 秒...")
        time.sleep(delay)

    def generate_epg(self, after_days=3, before_days=5, output_file=None, process_channels=True):
        """
        生成EPG XML文件
        :param after_days: 获取未来几天的节目单
        :param before_days: 获取过去几天的节目单
        :param output_file: 输出文件路径，为None时直接返回XML内容
        :param process_channels: 是否启用频道处理（清理名称和去重）
        """
        # 1. 获取频道列表
        print("正在获取频道列表...")
        channel_data = self._send_request(self.channel_list_url, {
            "CategoryId": "1000",
            "MediaAssetsId": "live"
        })
        
        if not channel_data or "l" not in channel_data or "il" not in channel_data["l"]:
            print("无法获取频道列表")
            return None
        
        iptv_list = channel_data["l"]["il"]
        print(f"成功获取到 {len(iptv_list)} 个频道")
        
        # 随机延迟
        self._random_sleep()

        # 2. 频道处理（清理名称+去重）
        if process_channels:
            iptv_list = self._process_channels(iptv_list)
            
            # 随机延迟
            self._random_sleep()

        # 3. 处理每个频道的节目单
        for index, item in enumerate(iptv_list):
            original_name = item.get("original_name", item.get("name", f"未知频道_{index}"))
            cleaned_name = item.get("cleaned_name", original_name)
            channel_id = item.get("id", f"channel_{index}")
            
            print(f"正在处理频道: {original_name} -> {cleaned_name} ({index+1}/{len(iptv_list)})")
            
            # 添加频道信息到XML（使用清理后的名称）
            channel_elem = ET.SubElement(self.xml_root, "channel")
            channel_elem.set("id", cleaned_name)
            
            display_name = ET.SubElement(channel_elem, "display-name")
            display_name.text = cleaned_name

            # 获取节目单
            playbill_data = self._send_request(self.playbill_url, {
                "AfterDay": after_days,
                "TimeZone": 8,
                "VideoType": 1,
                "Mode": "relative",
                "VideoId": channel_id,
                "BeforeDay": before_days
            })

            if not playbill_data or "day" not in playbill_data:
                print(f"无法获取频道 {cleaned_name} 的节目单")
                
                # 随机延迟
                self._random_sleep()
                
                continue

            # 处理节目单数据
            for day_item in playbill_data["day"]:
                date = day_item.get("day", "")
                if not date:
                    continue

                for program in day_item.get("item", []):
                    start_time_str = program.get("begin", "")
                    duration_str = program.get("time_len", "0")
                    program_name = program.get("text", "未知节目")

                    # 修复：将字符串转换为整数，并添加异常处理
                    try:
                        duration = int(duration_str)
                    except (ValueError, TypeError):
                        print(f"节目时长格式错误: {duration_str}，跳过该节目")
                        continue

                    if not start_time_str or duration <= 0:
                        continue

                    # 转换时间格式
                    try:
                        start_time, end_time = self._format_time(date, start_time_str, duration)
                    except ValueError as e:
                        print(f"时间格式错误: {str(e)}，跳过该节目")
                        continue

                    # 添加节目到XML（使用清理后的频道名称）
                    program_elem = ET.SubElement(self.xml_root, "programme")
                    program_elem.set("start", start_time)
                    program_elem.set("stop", end_time)
                    program_elem.set("channel", cleaned_name)

                    title = ET.SubElement(program_elem, "title")
                    title.text = program_name

            # 随机延迟
            self._random_sleep()

        # 4. 生成XML输出
        xml_content = self._prettify_xml()

        if output_file:
            with open(output_file, "w", encoding="utf-8") as f:
                f.write(xml_content)
            print(f"EPG文件已生成: {output_file}")
        else:
            print(xml_content)
        
        return xml_content

if __name__ == "__main__":
    parser = argparse.ArgumentParser(description="湖南电信IPTV内网EPG生成工具")
    parser.add_argument("--output", help="输出XML文件路径", default=None)
    parser.add_argument("--after-days", type=int, help="获取未来几天的节目单", default=3)
    parser.add_argument("--before-days", type=int, help="获取过去几天的节目单", default=5)
    parser.add_argument("--no-process", action="store_true", help="禁用频道处理（清理名称和去重）")
    parser.add_argument("--min-delay", type=float, help="最小延迟时间（秒）", default=0.1)
    parser.add_argument("--max-delay", type=float, help="最大延迟时间（秒）", default=5.0)
    args = parser.parse_args()

    epg = HunanTelecomEPG()
    
    # 配置随机延迟参数
    epg.min_delay = args.min_delay
    epg.max_delay = args.max_delay
    
    epg.generate_epg(
        after_days=args.after_days,
        before_days=args.before_days,
        output_file=args.output,
        process_channels=not args.no_process
    )